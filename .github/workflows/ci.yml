name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate (aws ${{ matrix.aws }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Verify the module against both supported AWS provider majors.
        aws: ["~> 5.0", "~> 6.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive -diff
      # Pin the AWS provider for this matrix leg. A *_override.tf file replaces
      # the version constraint in versions.tf; init -upgrade then resolves it.
      - name: Pin AWS provider to ${{ matrix.aws }}
        run: |
          cat > zz_ci_provider_override.tf <<EOF
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "${{ matrix.aws }}"
              }
            }
          }
          EOF
      - run: terraform init -backend=false -upgrade
      - run: terraform validate

  unit-tests:
    name: Unit Tests (aws ${{ matrix.aws }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        aws: ["~> 5.0", "~> 6.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Pin AWS provider to ${{ matrix.aws }}
        run: |
          cat > zz_ci_provider_override.tf <<EOF
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "${{ matrix.aws }}"
              }
            }
          }
          EOF
      - run: terraform init -backend=false -upgrade
      - run: terraform test -filter=tests/unit.tftest.hcl

  validate-examples:
    name: Examples (${{ matrix.example }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        example:
          - minimal
          - complete
          - ssm-only
          - private-subnet
          - full-monitoring
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend=false
        working-directory: examples/${{ matrix.example }}
      - run: terraform validate
        working-directory: examples/${{ matrix.example }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
      - run: tflint --recursive

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12.3115.0
        with:
          directory: .
          framework: terraform
          quiet: true
          compact: true
          skip_check: CKV_AWS_88,CKV_AWS_135,CKV_AWS_79,CKV_AWS_126,CKV_AWS_24,CKV_AWS_382,CKV_AWS_290,CKV_AWS_355,CKV_AWS_158,CKV_AWS_26

  go-checks:
    name: Go Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: test/go.mod
          cache-dependency-path: test/go.sum
      # Compile-checks the Terratest suite; does NOT run it. Terratest deploys
      # real AWS resources, so it stays out of CI and runs via `make test-integration`.
      - name: Build and vet
        working-directory: test
        run: |
          go build ./...
          go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2 # keep in sync with local `golangci-lint version`
          working-directory: test
          args: --timeout=3m
